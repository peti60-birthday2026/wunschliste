<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist-Wünsche 🎂🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2b1c14;
    --roast:#4a3123;
    --crema:#f3e6d3;
    --paper:#faf3e8;
    --clay:#b5583a;
    --ink:#3a2a1e;
    --line: rgba(43,28,20,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(181,88,58,0.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
  }
  header{
    background:var(--espresso);
    color:var(--crema);
    padding:56px 24px 72px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:24px;
    background:var(--paper);
    clip-path: polygon(0 100%, 4% 20%, 8% 100%, 12% 15%, 16% 100%, 20% 25%, 24% 100%, 28% 10%, 32% 100%, 36% 30%, 40% 100%, 44% 15%, 48% 100%, 52% 20%, 56% 100%, 60% 10%, 64% 100%, 68% 25%, 72% 100%, 76% 15%, 80% 100%, 84% 20%, 88% 100%, 92% 10%, 96% 100%, 100% 25%, 100% 100%);
  }
  .steam{
    position:absolute; top:14px; font-size:20px; opacity:0.4;
    animation: rise 4.5s ease-in-out infinite;
  }
  .steam.s1{left:34%; animation-delay:0s;}
  .steam.s2{left:50%; animation-delay:1.5s;}
  .steam.s3{left:44%; animation-delay:3s;}
  .steam.s4{left:60%; animation-delay:2.2s;}
  @keyframes rise{
    0%{transform:translateY(0) scale(0.8) rotate(0deg); opacity:0;}
    20%{opacity:0.45;}
    100%{transform:translateY(-46px) scale(1.15) rotate(12deg); opacity:0;}
  }
  .cake-crown{
    font-size:2.4rem;
    margin-bottom:6px;
    letter-spacing:6px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  }
  h1{
    font-family:'Caveat', cursive;
    font-size:clamp(2.6rem, 6vw, 4rem);
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header p{
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    opacity:0.85;
    margin:0;
    font-style:italic;
  }
  main{
    max-width:420px;
    margin:-34px auto 0;
    padding:0 20px 80px;
    position:relative;
    z-index:2;
  }
  .card{
    text-align:center;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:block;
    padding:16px 20px;
    border-radius:14px;
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:1rem;
    transition:transform 0.15s ease;
  }
  a.btn:active{ transform:scale(0.97); }
  a.btn.primary{
    background:var(--clay);
    color:var(--paper);
    box-shadow:0 8px 20px rgba(181,88,58,0.25);
  }
  a.btn.secondary{
    background:var(--crema);
    color:var(--espresso);
    border:1px solid var(--line);
  }
  a.btn .label{
    display:block;
    font-family:'Fraunces', serif;
    font-size:1.05rem;
  }
  a.btn .hint{
    display:block;
    font-size:0.8rem;
    font-weight:400;
    opacity:0.75;
    margin-top:3px;
  }
  a.btn:focus-visible{
    outline:3px solid var(--clay);
    outline-offset:2px;
  }
  a.btn .emoji{
    font-size:1.3rem;
    margin-right:6px;
    vertical-align:-2px;
  }
  .sprinkles{
    text-align:center;
    font-size:1.1rem;
    letter-spacing:10px;
    margin:26px 0 4px;
    opacity:0.7;
  }
  footer{
    margin-top:20px;
    font-size:0.78rem;
    color:var(--roast);
    opacity:0.5;
  }
</style>
</head>
<body>

<header>
  <span class="steam s1">✨</span>
  <span class="steam s2">🎉</span>
  <span class="steam s3">✨</span>
  <span class="steam s4">🎈</span>
  <div class="cake-crown">🎂🎵🎂</div>
  <h1>Playlist-Wünsche</h1>
  <p>Was soll auf der Party laufen? 🎂🎶</p>
</header>

<main>
  <div class="card">
    <div class="links">
      <a class="btn primary" href="playlist.html">
        <span class="label"><span class="emoji">🎶</span>Song eintragen</span>
        <span class="hint">Für alle Gäste</span>
      </a>
      <a class="btn secondary" href="admin.html">
        <span class="label"><span class="emoji">🎂</span>Admin-Ansicht</span>
        <span class="hint">Nur für den Gastgeber</span>
      </a>
    </div>

    <div class="sprinkles">🎂 · 🎉 · 🎈 · 🎵 · 🎂</div>
    <footer>playlist-geburtstag-2026</footer>
  </div>
</main>

</body>
</html>
